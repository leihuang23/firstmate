# Periodically pull kunchenguid/firstmate (upper source) into this publish repo
# (leihuang23/firstmate). Clean merges open a review PR; real conflicts hand off
# to GitHub Copilot cloud agent to resolve while preserving local customizations.
#
# Required for conflict resolution (not needed for clean merges):
#   Repository secret COPILOT_AGENT_TOKEN
#   - Prefer a classic PAT with the `repo` scope (most reliable for agent tasks).
#   - Fine-grained PATs often return HTTP 403 forbidden on POST /agents/repos/.../tasks.
#   - Token must belong to a user who can use Copilot coding agent on this repo.
#   - Installation tokens (GITHUB_TOKEN) cannot start Copilot agent tasks.
#   - Do not prefix the secret value with "Bearer "; strip whitespace when pasting.
#
# Optional:
#   vars.UPSTREAM_REPO  - default kunchenguid/firstmate
#   vars.UPSTREAM_REF   - default main
name: Sync upstream

on:
  schedule:
    # Daily 08:15 UTC (offset from the hour to reduce schedule thundering herds)
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      force_copilot:
        description: "Skip the local merge attempt and ask Copilot to perform the full sync"
        type: boolean
        default: false
      open_as_draft:
        description: "Open the sync PR as a draft"
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Required when upper source changes .github/workflows/*; otherwise
  # `git push` of the upstream tip is rejected with:
  # "refusing to allow a GitHub App to create or update workflow ... without
  # workflows permission".
  workflows: write

env:
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'kunchenguid/firstmate' }}
  UPSTREAM_REF: ${{ vars.UPSTREAM_REF || 'main' }}
  # Stable label used to find an already-open sync PR
  SYNC_LABEL: upstream-sync

jobs:
  sync:
    name: Sync from upper source
    runs-on: ubuntu-latest
    # Only run on the publish repo so this workflow never fires if it is ever
    # contributed back to the upper source.
    if: github.repository == 'leihuang23/firstmate'
    steps:
      - name: Checkout publish main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upper source
        id: fetch
        run: |
          set -eu
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_REF}"
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_REF}")"
          local_sha="$(git rev-parse HEAD)"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          echo "local_sha=${local_sha}" >> "$GITHUB_OUTPUT"
          echo "Upper source ${UPSTREAM_REPO}@${UPSTREAM_REF} = ${upstream_sha}"
          echo "Publish main = ${local_sha}"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "already_up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Publish main already contains upper source tip."
          else
            echo "already_up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Upper source has commits not in publish main."
            git log --oneline "HEAD..${upstream_sha}" | head -40 || true
          fi

      - name: Skip when already synced
        if: steps.fetch.outputs.already_up_to_date == 'true'
        run: |
          echo "Nothing to sync. Publish main already includes ${UPSTREAM_REPO}@${UPSTREAM_REF}."

      - name: Ensure sync label exists
        if: steps.fetch.outputs.already_up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh label list --json name --jq '.[].name' | grep -qx "$SYNC_LABEL"; then
            gh label create "$SYNC_LABEL" \
              --color "0E8A16" \
              --description "Automated sync from upper source (kunchenguid/firstmate)" \
              || true
          fi

      - name: Reuse open sync PR if present
        id: existing
        if: steps.fetch.outputs.already_up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Prefer an open PR that still targets the current upstream tip when possible.
          pr_json="$(gh pr list --state open --label "$SYNC_LABEL" --json number,url,headRefName,body --jq '.[0] // empty')"
          if [ -z "$pr_json" ]; then
            echo "has_open_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number="$(printf '%s' "$pr_json" | jq -r '.number')"
          url="$(printf '%s' "$pr_json" | jq -r '.url')"
          head="$(printf '%s' "$pr_json" | jq -r '.headRefName')"
          echo "has_open_pr=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=${number}" >> "$GITHUB_OUTPUT"
          echo "pr_url=${url}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${head}" >> "$GITHUB_OUTPUT"
          echo "Open sync PR already exists: ${url}"

      - name: Attempt clean merge into a sync branch
        id: merge
        if: >-
          steps.fetch.outputs.already_up_to_date == 'false' &&
          steps.existing.outputs.has_open_pr != 'true' &&
          inputs.force_copilot != true
        run: |
          set -eu
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          short_sha="$(printf '%s' "${{ steps.fetch.outputs.upstream_sha }}" | cut -c1-7)"
          branch="sync/upstream-${stamp}-${short_sha}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          git checkout -B "$branch" main
          set +e
          git merge --no-ff --no-edit "upstream/${UPSTREAM_REF}"
          merge_rc=$?
          set -e

          if [ "$merge_rc" -eq 0 ]; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            git push -u origin "HEAD:refs/heads/${branch}"
            echo "Pushed clean merge branch ${branch}"
            exit 0
          fi

          # Capture conflict inventory for the Copilot handoff, then abandon the
          # dirty worktree so the Copilot path starts from a clean main base.
          conflicted="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
          echo "status=conflict" >> "$GITHUB_OUTPUT"
          echo "conflicted_files=${conflicted}" >> "$GITHUB_OUTPUT"
          echo "Merge conflicts detected:"
          git diff --name-only --diff-filter=U || true
          git merge --abort
          git checkout main
          git branch -D "$branch" || true

      - name: Open PR for clean merge
        id: clean_pr
        if: steps.merge.outputs.status == 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
          DRAFT: ${{ inputs.open_as_draft == true && 'true' || 'false' }}
        run: |
          set -eu
          title="chore: sync upstream from ${UPSTREAM_REPO}"
          body="$(cat <<EOF
          ## Upstream sync

          Automated merge of [\`${UPSTREAM_REPO}@${UPSTREAM_REF}\`](https://github.com/${UPSTREAM_REPO}/tree/${UPSTREAM_REF}) into this publish repo.

          | | |
          | --- | --- |
          | Upper source | \`${UPSTREAM_REPO}@${UPSTREAM_REF}\` |
          | Upstream tip | \`${UPSTREAM_SHA}\` |
          | Merge | Clean (no conflicts) |

          ### Review notes
          - This PR was opened by the scheduled **Sync upstream** workflow.
          - Prefer merging with a normal merge commit (not squash) so upper-source history stays recoverable.
          - Local customizations on publish \`main\` were preserved by the merge commit.

          <!-- sync-upstream upstream-sha=${UPSTREAM_SHA} -->
          EOF
          )"

          draft_flag=()
          if [ "$DRAFT" = "true" ]; then
            draft_flag=(--draft)
          fi

          url="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$title" \
            --body "$body" \
            --label "$SYNC_LABEL" \
            "${draft_flag[@]}")"
          number="$(gh pr view "$url" --json number --jq '.number')"
          echo "pr_url=${url}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${number}" >> "$GITHUB_OUTPUT"
          echo "Opened clean sync PR: ${url}"

      # Conflict / force path:
      # 1) Always open a PR whose head is the pure upper-source tip (GitHub then
      #    reports conflicts against publish main). This uses GITHUB_TOKEN only.
      # 2) Hand the PR to Copilot via agent-tasks API, then @copilot PR comment,
      #    then issue assignment. Agent tasks require a user PAT that can use
      #    Copilot cloud agent (classic repo-scoped PAT is the most reliable).
      - name: Open conflict PR and hand off to Copilot
        id: conflict
        if: >-
          steps.fetch.outputs.already_up_to_date == 'false' &&
          steps.existing.outputs.has_open_pr != 'true' &&
          (steps.merge.outputs.status == 'conflict' || inputs.force_copilot == true)
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
          CONFLICTED: ${{ steps.merge.outputs.conflicted_files || '' }}
          FORCE: ${{ inputs.force_copilot == true && 'true' || 'false' }}
          DRAFT: ${{ inputs.open_as_draft == true && 'true' || 'false' }}
        run: |
          set -eu

          stamp="$(date -u +%Y%m%d-%H%M%S)"
          short_sha="$(printf '%s' "$UPSTREAM_SHA" | cut -c1-7)"
          branch="sync/upstream-${stamp}-${short_sha}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          # Head = exact upper-source tip. Base = publish main. GitHub surfaces
          # the real merge conflicts; Copilot's conflict flow targets this shape.
          git push origin "refs/remotes/upstream/${UPSTREAM_REF}:refs/heads/${branch}"

          conflict_block="${CONFLICTED:-not enumerated (force_copilot or direct handoff)}"
          title="chore: sync upstream from ${UPSTREAM_REPO}"
          body="$(cat <<EOF
          ## Upstream sync (conflicts)

          Automated sync of [\`${UPSTREAM_REPO}@${UPSTREAM_REF}\`](https://github.com/${UPSTREAM_REPO}/tree/${UPSTREAM_REF}) into this publish repo.

          | | |
          | --- | --- |
          | Upper source | \`${UPSTREAM_REPO}@${UPSTREAM_REF}\` |
          | Upstream tip | \`${UPSTREAM_SHA}\` |
          | Merge | **Conflicts** - Copilot handoff requested |

          ### Conflicted paths (workflow pre-check)
          \`\`\`
          ${conflict_block}
          \`\`\`

          ### Conflict policy for Copilot
          1. Merge \`main\` into this branch (or otherwise make this PR mergeable).
          2. Integrate upper-source improvements for shared firstmate core behavior.
          3. Preserve intentional local customizations on this publish fork (for example verified omp / kimi harness adapters and other leihuang23-only commits).
          4. When both sides changed the same area, combine them; never leave conflict markers.
          5. Prefer preserving recoverable history over squashing upper-source commits.

          ### Manual fallback
          If Copilot did not start, use **Fix with Copilot** on this PR, or comment:
          \`@copilot Merge main into this branch and resolve all conflicts using the policy above.\`

          <!-- sync-upstream upstream-sha=${UPSTREAM_SHA} -->
          EOF
          )"

          draft_flag=()
          if [ "$DRAFT" = "true" ]; then
            draft_flag=(--draft)
          fi

          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body "$body" \
            --label "$SYNC_LABEL" \
            "${draft_flag[@]}")"
          pr_number="$(gh pr view "$pr_url" --json number --jq '.number')"
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "Opened conflict sync PR: ${pr_url}"

          handoff=""
          # Normalize secret: strip CR/LF/space and an accidental "Bearer " prefix.
          token="$(printf '%s' "${COPILOT_AGENT_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^[Bb]earer[[:space:]]//')"

          if [ -z "$token" ]; then
            {
              echo "::error::Opened ${pr_url} but COPILOT_AGENT_TOKEN is missing, so Copilot was not started."
              echo "Add a classic PAT (repo scope) as secret COPILOT_AGENT_TOKEN, then re-run or comment @copilot on the PR."
            } >&2
            exit 1
          fi

          # --- Path A: agent tasks API (user-to-server token only) ---
          prompt="$(cat <<EOF
          Resolve merge conflicts on pull request #${pr_number} in ${{ github.repository }}.

          The PR head is upper source ${UPSTREAM_REPO}@${UPSTREAM_REF} (${UPSTREAM_SHA}).
          The PR base is publish main (includes local customizations).

          Do this:
          1. Check out the PR branch and merge origin/main into it (or equivalent) so the PR becomes mergeable.
          2. Resolve every conflict:
             - Integrate upper-source improvements for shared firstmate core.
             - Preserve intentional local customizations (omp / kimi adapters and other leihuang23-only work).
             - Combine both sides when the same area changed; never leave conflict markers.
          3. Push the resolved branch and leave PR #${pr_number} ready for review.
          4. Summarize what you resolved in a PR comment.

          Known conflicted paths from the workflow pre-check:
          ${conflict_block}

          Force full Copilot sync input: ${FORCE}
          EOF
          )"

          payload="$(jq -n \
            --arg prompt "$prompt" \
            --arg base "main" \
            '{prompt: $prompt, base_ref: $base, create_pull_request: false}')"

          echo "Trying Copilot agent tasks API..."
          http_code="$(curl -sS -o /tmp/copilot-task.json -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${token}" \
            "https://api.github.com/agents/repos/${{ github.repository }}/tasks" \
            -d "$payload" || true)"
          echo "Agent tasks HTTP ${http_code}"
          cat /tmp/copilot-task.json
          echo

          task_id="$(jq -r '.id // empty' /tmp/copilot-task.json)"
          task_url="$(jq -r '.html_url // .url // empty' /tmp/copilot-task.json)"
          if [ -n "$task_id" ]; then
            handoff="agent-task"
            echo "task_id=${task_id}" >> "$GITHUB_OUTPUT"
            echo "task_url=${task_url}" >> "$GITHUB_OUTPUT"
            echo "Copilot agent task started: ${task_url:-$task_id}"
          else
            echo "::warning::Agent tasks API did not start a task (HTTP ${http_code}). Response above."
            if [ "$http_code" = "403" ] || [ "$http_code" = "401" ]; then
              echo "::warning::Token was rejected for agent tasks. Prefer a classic PAT with the repo scope from a user who can use Copilot coding agent on this repo. Fine-grained PATs often return forbidden for this endpoint."
            fi
          fi

          # --- Path B: @copilot comment on the conflict PR (official conflict flow) ---
          if [ -z "$handoff" ]; then
            echo "Trying @copilot PR comment handoff..."
            comment_body="$(cat <<EOF
          @copilot Merge \`main\` into this branch and resolve all merge conflicts.

          Policy:
          - Integrate upper-source improvements from \`${UPSTREAM_REPO}@${UPSTREAM_REF}\` (\`${UPSTREAM_SHA}\`).
          - Preserve local publish-fork customizations (omp / kimi adapters and other leihuang23-only commits).
          - Combine both sides when the same area changed; never leave conflict markers.
          - Leave this PR mergeable and summarize the resolutions.

          Conflicted paths from the workflow pre-check:
          ${conflict_block}
          EOF
            )"
            comment_payload="$(jq -n --arg body "$comment_body" '{body: $body}')"
            comment_code="$(curl -sS -o /tmp/copilot-comment.json -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer ${token}" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${pr_number}/comments" \
              -d "$comment_payload" || true)"
            echo "PR comment HTTP ${comment_code}"
            cat /tmp/copilot-comment.json
            echo
            comment_id="$(jq -r '.id // empty' /tmp/copilot-comment.json)"
            if [ -n "$comment_id" ] && [ "$comment_code" = "201" ]; then
              handoff="pr-comment"
              echo "comment_id=${comment_id}" >> "$GITHUB_OUTPUT"
              echo "Posted @copilot conflict-resolution comment on PR #${pr_number}"
            else
              echo "::warning::Could not post @copilot comment with COPILOT_AGENT_TOKEN (HTTP ${comment_code})."
            fi
          fi

          # --- Path C: create issue assigned to copilot-swe-agent ---
          if [ -z "$handoff" ]; then
            echo "Trying Copilot issue assignment handoff..."
            # Read-only GraphQL can use GITHUB_TOKEN (already in GH_TOKEN).
            bot_id="$(gh api graphql -f query='
              query($owner:String!,$name:String!) {
                repository(owner:$owner, name:$name) {
                  suggestedActors(capabilities:[CAN_BE_ASSIGNED], first:100) {
                    nodes {
                      login
                      ... on Bot { id }
                      ... on User { id }
                    }
                  }
                }
              }' -f owner='${{ github.repository_owner }}' -f name='${{ github.event.repository.name }}' \
              --jq '.data.repository.suggestedActors.nodes[] | select(.login=="copilot-swe-agent") | .id' || true)"
            repo_id="$(gh api graphql -f query='
              query($owner:String!,$name:String!) {
                repository(owner:$owner, name:$name) { id }
              }' -f owner='${{ github.repository_owner }}' -f name='${{ github.event.repository.name }}' \
              --jq '.data.repository.id')"

            if [ -z "$bot_id" ]; then
              echo "::warning::copilot-swe-agent is not assignable on this repository."
            else
              issue_title="chore: resolve upstream sync conflicts for PR #${pr_number}"
              issue_body="$(cat <<EOF
              ## Upstream sync conflict handoff

              Please resolve conflicts on ${pr_url} and make that PR mergeable.

              - Upper source: https://github.com/${UPSTREAM_REPO}/tree/${UPSTREAM_REF}
              - Upstream tip: \`${UPSTREAM_SHA}\`
              - Publish base: \`main\`
              - Conflicted paths: ${conflict_block}

              Policy: integrate upper-source core improvements; preserve local customizations; never leave conflict markers.

              Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              EOF
              )"
              custom_instructions="Resolve merge conflicts on PR #${pr_number} (${pr_url}). Merge main into the PR branch. Preserve local customizations while integrating ${UPSTREAM_REPO}@${UPSTREAM_REF} (${UPSTREAM_SHA})."
              query='mutation($repositoryId:ID!, $title:String!, $body:String!, $assigneeIds:[ID!]!, $targetRepositoryId:ID!, $baseRef:String!, $customInstructions:String!) {
                createIssue(input: {
                  repositoryId: $repositoryId
                  title: $title
                  body: $body
                  assigneeIds: $assigneeIds
                  agentAssignment: {
                    targetRepositoryId: $targetRepositoryId
                    baseRef: $baseRef
                    customInstructions: $customInstructions
                    customAgent: ""
                    model: ""
                  }
                }) {
                  issue { number url }
                }
              }'
              issue_payload="$(jq -n \
                --arg query "$query" \
                --arg repositoryId "$repo_id" \
                --arg title "$issue_title" \
                --arg body "$issue_body" \
                --arg botId "$bot_id" \
                --arg targetRepositoryId "$repo_id" \
                --arg baseRef "main" \
                --arg customInstructions "$custom_instructions" \
                '{
                  query: $query,
                  variables: {
                    repositoryId: $repositoryId,
                    title: $title,
                    body: $body,
                    assigneeIds: [$botId],
                    targetRepositoryId: $targetRepositoryId,
                    baseRef: $baseRef,
                    customInstructions: $customInstructions
                  }
                }')"
              issue_code="$(curl -sS -o /tmp/copilot-issue.json -w '%{http_code}' -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Authorization: Bearer ${token}" \
                -H "GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection" \
                -H "Content-Type: application/json" \
                https://api.github.com/graphql \
                -d "$issue_payload" || true)"
              echo "Issue assignment HTTP ${issue_code}"
              cat /tmp/copilot-issue.json
              echo
              issue_url="$(jq -r '.data.createIssue.issue.url // empty' /tmp/copilot-issue.json)"
              if [ -n "$issue_url" ]; then
                handoff="issue"
                echo "issue_url=${issue_url}" >> "$GITHUB_OUTPUT"
                echo "Assigned Copilot via issue: ${issue_url}"
              else
                echo "::warning::Issue assignment to Copilot failed."
              fi
            fi
          fi

          echo "handoff=${handoff}" >> "$GITHUB_OUTPUT"
          if [ -z "$handoff" ]; then
            {
              echo "::error::Opened conflict PR ${pr_url}, but every Copilot handoff path failed."
              echo
              echo "Fix COPILOT_AGENT_TOKEN, then re-run or click Fix with Copilot / comment @copilot on the PR."
              echo
              echo "Recommended secret value: a classic personal access token with the repo scope,"
              echo "created by a user who can use Copilot coding agent on this repository."
              echo "Fine-grained PATs often get HTTP 403 forbidden on POST /agents/repos/.../tasks."
              echo
              echo "Also verify the secret has no leading/trailing whitespace and is not prefixed with 'Bearer '."
            } >&2
            exit 1
          fi

          echo "Conflict PR ready with Copilot handoff via ${handoff}: ${pr_url}"

      - name: Job summary
        if: always()
        env:
          ALREADY: ${{ steps.fetch.outputs.already_up_to_date }}
          EXISTING_PR: ${{ steps.existing.outputs.pr_url }}
          CLEAN_PR: ${{ steps.clean_pr.outputs.pr_url }}
          CONFLICT_PR: ${{ steps.conflict.outputs.pr_url }}
          COPILOT_TASK: ${{ steps.conflict.outputs.task_url || steps.conflict.outputs.task_id }}
          HANDOFF: ${{ steps.conflict.outputs.handoff }}
          FALLBACK_ISSUE: ${{ steps.conflict.outputs.issue_url }}
          MERGE_STATUS: ${{ steps.merge.outputs.status }}
          CONFLICTS: ${{ steps.merge.outputs.conflicted_files }}
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
        run: |
          set -eu
          {
            echo "## Sync upstream"
            echo
            echo "- Upper source: \`${UPSTREAM_REPO}@${UPSTREAM_REF}\`"
            echo "- Upstream tip: \`${UPSTREAM_SHA:-unknown}\`"
            echo "- Already up to date: \`${ALREADY:-unknown}\`"
            echo "- Local merge status: \`${MERGE_STATUS:-n/a}\`"
            if [ -n "${CONFLICTS:-}" ]; then
              echo "- Conflicted files: \`${CONFLICTS}\`"
            fi
            if [ -n "${EXISTING_PR:-}" ]; then
              echo "- Existing open sync PR: ${EXISTING_PR}"
            fi
            if [ -n "${CLEAN_PR:-}" ]; then
              echo "- Clean merge PR: ${CLEAN_PR}"
            fi
            if [ -n "${CONFLICT_PR:-}" ]; then
              echo "- Conflict sync PR: ${CONFLICT_PR}"
            fi
            if [ -n "${HANDOFF:-}" ]; then
              echo "- Copilot handoff: \`${HANDOFF}\`"
            fi
            if [ -n "${COPILOT_TASK:-}" ]; then
              echo "- Copilot task: ${COPILOT_TASK}"
            fi
            if [ -n "${FALLBACK_ISSUE:-}" ]; then
              echo "- Copilot issue: ${FALLBACK_ISSUE}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
